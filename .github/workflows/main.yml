name: devsecops_pipeline

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'monitoring/grafana_dashboard.json'
      - 'screenshots/**'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'monitoring/grafana_dashboard.json'
      - 'screenshots/**'

jobs:
  build-and-scan-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  #v7.0.0

      - name: Build Docker Image
        run: docker build -t juice-shop:ci .
        
      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  #v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'juice-shop:ci'
          format: 'sarif'
          output: 'trivy-image.sarif'
          ignore-unfixed: true
          
      - name: Upload Trivy image SARIF to Security tab
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a  #v4.37.1
        with:
          sarif_file: 'trivy-image.sarif'

      - name: Upload Trivy image SARIF as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  #v7.0.1
        with:
          name: trivy-image-sarif
          path: trivy-image.sarif

      - name: Generate CycloneDX SBOM from image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  #v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'juice-shop:ci'
          format: 'cyclonedx'
          output: 'sbom.cdx.json'

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  #v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

      - name: Trivy Advisory (shows MEDIUM/LOW, does not block)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  #v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'juice-shop:ci'
          scanners: 'vuln'
          format: 'table'
          exit-code: '0'
          severity: 'MEDIUM,LOW'
          ignore-unfixed: true
          
      - name: Trivy Quality Gate (blocks on CRITICAL/HIGH fixable)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  #v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'juice-shop:ci'
          scanners: 'vuln'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          
  semgrep-sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write       
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  #v7.0.0

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  #v6.0.0
        with:
          python-version: '3.x'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep (SARIF)
        run: semgrep scan --config p/owasp-top-ten --exclude='*.spec.ts' --exclude='*.test.ts' --exclude='test' --exclude='cypress' --sarif --output semgrep.sarif
        continue-on-error: true   
        
      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a #v4.37.1
        with:
          sarif_file: semgrep.sarif
          
      - name: Upload Semgrep SARIF as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  #v7.0.1
        with:
          name: semgrep-sarif
          path: semgrep.sarif

      - name: Semgrep Advisory (shows WARNING/INFO, does not block)
        run: semgrep scan --config p/owasp-top-ten --exclude='*.spec.ts' --exclude='*.test.ts' --exclude='test' --exclude='cypress' --exclude='.github' --exclude='data/static/codefixes' --severity WARNING --severity INFO
        continue-on-error: true

      - name: Semgrep Quality Gate (blocks on ERROR in prod code)
        run: semgrep scan --config p/owasp-top-ten --exclude='*.spec.ts' --exclude='*.test.ts' --exclude='test' --exclude='cypress' --exclude='.github' --exclude='data/static/codefixes' --severity ERROR --error
 
  trivy-fs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  #v7.0.0

      - name: Run Trivy filesystem scan (secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   #v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'secret'
          format: 'sarif'
          output: 'trivy-fs.sarif'

      - name: Upload Trivy SARIF to Security tab
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a  #v4.37.1
        with:
          sarif_file: 'trivy-fs.sarif'

      - name: Upload Trivy SARIF as artifact

        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  #v7.0.1
        with:
          name: trivy-fs-sarif
          path: trivy-fs.sarif

          
  trivy-config:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  #v7.0.0

      - name: Run Trivy config scan (IaC / Dockerfile)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  #v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-config.sarif'

      - name: Upload Trivy config SARIF to Security tab
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a  #v4.37.1
        with:
          sarif_file: 'trivy-config.sarif'

      - name: Upload Trivy config SARIF as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  #v7.0.1
        with:
          name: trivy-config-sarif
          path: trivy-config.sarif
        
  import-defectdojo:
    runs-on: ubuntu-latest
    needs: [build-and-scan-image, semgrep-sast, trivy-fs, trivy-config]
    if: always()
    steps:
      - name: Download all SARIF artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   #v8.0.1
        with:
          path: sarifs

      - name: Reimport Semgrep
        run: |
          curl -sS -f -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/reimport-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=SARIF" \
            -F "product_name=OWASP Juice Shop" \
            -F "engagement_name=Automated Scans" \
            -F "test_title=Semgrep SAST" \
            -F "auto_create_context=true" \
            -F "close_old_findings=true" \
            -F "minimum_severity=Info" \
            -F "file=@sarifs/semgrep-sarif/semgrep.sarif"

      - name: Reimport Trivy image
        run: |
          curl -sS -f -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/reimport-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=SARIF" \
            -F "product_name=OWASP Juice Shop" \
            -F "engagement_name=Automated Scans" \
            -F "test_title=Trivy Image" \
            -F "auto_create_context=true" \
            -F "close_old_findings=true" \
            -F "minimum_severity=Info" \
            -F "file=@sarifs/trivy-image-sarif/trivy-image.sarif"

      - name: Reimport Trivy filesystem
        run: |
          curl -sS -f -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/reimport-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=SARIF" \
            -F "product_name=OWASP Juice Shop" \
            -F "engagement_name=Automated Scans" \
            -F "test_title=Trivy Filesystem" \
            -F "auto_create_context=true" \
            -F "close_old_findings=true" \
            -F "minimum_severity=Info" \
            -F "file=@sarifs/trivy-fs-sarif/trivy-fs.sarif"

      - name: Reimport Trivy config
        run: |
          curl -sS -f -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/reimport-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=SARIF" \
            -F "product_name=OWASP Juice Shop" \
            -F "engagement_name=Automated Scans" \
            -F "test_title=Trivy Config" \
            -F "auto_create_context=true" \
            -F "close_old_findings=true" \
            -F "minimum_severity=Info" \
            -F "file=@sarifs/trivy-config-sarif/trivy-config.sarif"  
