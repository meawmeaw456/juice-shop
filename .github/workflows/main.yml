# =============================================================================
# DevSecOps pipeline — OWASP Juice Shop
#
# ONE pipeline, ONE quality gate.
#   Scans run in parallel (image + SBOM, SAST, secrets, IaC/config) and only
#   upload reports. A single `quality-gate` job then evaluates every policy in
#   one place and decides:  PASS = READY  /  FAIL = NOT READY FOR DEPLOYMENT.
#   Findings are also imported into DefectDojo (source of truth for SecureFlow).
#
# To reuse in another project, edit only the `env:` block below and the branch
# names under `on:` (see README.md).
# =============================================================================

name: devsecops_pipeline

on:
  push:
    branches: [ master ]
    paths-ignore: ['**.md', 'LICENSE', 'monitoring/grafana_dashboard.json', 'screenshots/**']
    
  pull_request:
    branches: [ master ]
    paths-ignore: ['**.md', 'LICENSE', 'monitoring/grafana_dashboard.json', 'screenshots/**']

# ----- EDIT HERE to reuse for another project -----
env:
  IMAGE_REF: juice-shop:ci            # image tag to build & scan
  DOCKERFILE: Dockerfile              # path to the Dockerfile
  DD_PRODUCT: "OWASP Juice Shop"      # DefectDojo product name
  DD_ENGAGEMENT: "Automated Scans"    # DefectDojo engagement name
# --------------------------------------------------



# Cancel a previous run still in progress on the same ref (PR or branch)

concurrency: 
  group: ${{ github.workflow}}-${{ github.ref}}
  cancel-in-progress: true

# No permissions by default; each job requests the strict minimum

permissions: {}

jobs:

  # ---------------------------------------------------------------------------
  # 1. Container image: build -> Trivy vuln scan (SARIF) -> CycloneDX SBOM
  # ---------------------------------------------------------------------------

  build-and-scan-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      
    steps:
    
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit
          
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  #v7.0.0
        with:
          persist-credentials: false

      - name: Build Docker Image
        run: docker build -t "${{ env.IMAGE_REF }}" -f "${{ env.DOCKERFILE }}" .

       # Scan only — the single gate at the end decides pass/fail.
        
      - name: Run Trivy Image Scan(SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  #v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ env.IMAGE_REF }}
          format: 'sarif'
          output: 'trivy-image.sarif'
          ignore-unfixed: true
          
      - name: Upload Trivy image SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a  #v4.37.1
        continue-on-error: true
        with:
          sarif_file: 'trivy-image.sarif'
          category: trivy-image
       

      - name: Upload Trivy image SARIF as artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  #v7.0.1
        with:
          name: trivy-image-sarif
          path: trivy-image.sarif
          if-no-files-found: error

      - name: Generate CycloneDX SBOM from image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  #v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ env.IMAGE_REF }}
          format: 'cyclonedx'
          output: 'sbom.cdx.json'

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  #v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2. SAST (Semgrep) — one scan, emits SARIF + JSON
  # ---------------------------------------------------------------------------
          
  semgrep-sast:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write       
    steps:
    
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit
          
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  #v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  #v6.0.0
        with:
          python-version: '3.x'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep (SARIF + JSON)
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --exclude='*.spec.ts' \
            --exclude='*.test.ts' \
            --exclude='test' \
            --exclude='cypress' \
            --exclude='.github' \
            --exclude='data/static/codefixes' \
            --sarif-output=semgrep.sarif \
            --json-output=semgrep.json
            
        
      - name: Upload SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a #v4.37.1
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      
          
      - name: Upload Semgrep reports artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  #v7.0.1
        with:
          name: semgrep-reports
          path: |
            semgrep.sarif
            semgrep.json
          if-no-files-found: error
          
  # ---------------------------------------------------------------------------
  # 3. Secret scan (Trivy filesystem)
  # ---------------------------------------------------------------------------
  
  trivy-fs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      
    steps:
    
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit
          
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  #v7.0.0
        with:
          persist-credentials: false

      - name: Trivy Filesystem Secret Scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   #v0.36.0
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'secret'
          format: 'sarif'
          output: 'trivy-fs.sarif'

      - name: Upload Trivy FS SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a  #v4.37.1
        continue-on-error: true
        with:
          sarif_file: 'trivy-fs.sarif'
          category: trivy-fs
        

      - name: Upload Trivy SARIF FS as artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  #v7.0.1
        with:
          name: trivy-fs-sarif
          path: trivy-fs.sarif
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 4. IaC / Dockerfile scan (Trivy config)
  # ---------------------------------------------------------------------------
          
  trivy-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
    
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit
          
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  #v7.0.0
        with:
          persist-credentials: false

      - name: Run Trivy config scan (IaC / Dockerfile)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  #v0.36.0
        continue-on-error: true
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-config.sarif'

      - name: Upload Trivy config SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a  #v4.37.1
        continue-on-error: true
        with:
          sarif_file: 'trivy-config.sarif'
          category: trivy-config
        

      - name: Upload Trivy config SARIF as artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  #v7.0.1
        with:
          name: trivy-config-sarif
          path: trivy-config.sarif
          if-no-files-found: error
  # ---------------------------------------------------------------------------
  # 5. THE SINGLE QUALITY GATE
  #
  # Waits for all scans, downloads their reports, evaluates every policy in ONE
  # place. `jq` is pre-installed on GitHub-hosted Ubuntu runners.
  #
  # Trivy severity -> SARIF level mapping (from Trivy's own output):
  #   CRITICAL, HIGH -> "error"   MEDIUM -> "warning"   LOW -> "note"
  # so counting results with level=="error" == count of CRITICAL/HIGH.
  # ---------------------------------------------------------------------------

  quality-gate:
    needs: [build-and-scan-image, semgrep-sast, trivy-fs, trivy-config]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit
 
      - name: Download all scan reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: reports
 
      - name: Evaluate Security Policy
        shell: bash
        run: |
          set -u
          echo "=============================================="
          echo "            SECURITY QUALITY GATE"
          echo "=============================================="
          FAILED=0
          fail() { echo "❌ $1"; FAILED=1; }
          pass() { echo "✅ $1"; }
 
          # An expected report that is missing means the scanner failed;
          # we cannot assert safety, so that blocks the gate.
          need() { [ -f "$1" ] || { fail "$2: report missing (scan failed?)"; return 1; }; }
 
          # ---- Trivy Image: block on CRITICAL/HIGH ----
          echo ""; echo "-- Trivy Image (policy: no fixable CRITICAL/HIGH) --"
          F=reports/trivy-image-sarif/trivy-image.sarif
          if need "$F" "Trivy Image"; then
            N=$(jq '[.runs[]?.results[]? | select(.level=="error")] | length' "$F")
            echo "CRITICAL/HIGH: $N"
            [ "$N" -gt 0 ] && fail "Trivy Image" || pass "Trivy Image"
          fi
 
          # ---- Semgrep: block on ERROR ----
          echo ""; echo "-- Semgrep (policy: no ERROR) --"
          F=reports/semgrep-reports/semgrep.json
          if need "$F" "Semgrep"; then
            N=$(jq '[.results[]? | select((.extra.severity // "") | ascii_upcase == "ERROR")] | length' "$F")
            echo "ERROR findings: $N"
            [ "$N" -gt 0 ] && fail "Semgrep" || pass "Semgrep"
          fi
 
          # ---- Trivy Filesystem: block on any secret ----
          echo ""; echo "-- Trivy Filesystem (policy: no secrets) --"
          F=reports/trivy-fs-sarif/trivy-fs.sarif
          if need "$F" "Trivy Filesystem"; then
            N=$(jq '[.runs[]?.results[]?] | length' "$F")
            echo "Secrets detected: $N"
            [ "$N" -gt 0 ] && fail "Trivy Filesystem" || pass "Trivy Filesystem"
          fi
 
          # ---- Trivy Config: block on CRITICAL/HIGH ----
          echo ""; echo "-- Trivy Config (policy: no CRITICAL/HIGH) --"
          F=reports/trivy-config-sarif/trivy-config.sarif
          if need "$F" "Trivy Config"; then
            N=$(jq '[.runs[]?.results[]? | select(.level=="error")] | length' "$F")
            echo "CRITICAL/HIGH: $N"
            [ "$N" -gt 0 ] && fail "Trivy Config" || pass "Trivy Config"
          fi
 
          echo ""
          echo "=============================================="
          echo "                FINAL DECISION"
          echo "=============================================="
          if [ "$FAILED" -ne 0 ]; then
            echo "❌ SECURITY QUALITY GATE: FAILED"
            echo "🚫 APPLICATION STATUS: NOT READY FOR DEPLOYMENT"
            exit 1
          else
            echo "✅ SECURITY QUALITY GATE: PASSED"
            echo "🚀 APPLICATION STATUS: READY FOR DEPLOYMENT"
          fi
 
  # ---------------------------------------------------------------------------
  # 6. Import all reports into DefectDojo (source of truth for SecureFlow).
  #    Runs independently of the gate, so findings are recorded even when the
  #    gate blocks the deploy. Push events only.
  # ---------------------------------------------------------------------------

  import-defectdojo:
    needs: [build-and-scan-image, semgrep-sast, trivy-fs, trivy-config]
    if: ${{ always() && !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    env: 
      DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
      DEFECTDOJO_TOKEN: ${{ secrets.DEFECTDOJO_TOKEN }}
      
    steps:
    
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit

      - name: Guard:token DefectDojo présent ?
        id: guard
        run: |
          if [ -z "${DEFECTDOJO_URL}" ] || [ -z "${DEFECTDOJO_TOKEN}" ]; then
            echo "::warning::DEFECTDOJO_URL/TOKEN not set ,import skipped."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
          
      - name: Download all scan reports
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   #v8.0.1
        with:
          path: reports
      
      - name: Reimport into DefectDojo
        if: steps.guard.outputs.enabled == 'true'
        shell: bash
        run: |
          set -u
          reimport() {  # $1 scan_type, $2 test_title, $3 file
            if [ -f "$3" ]; then
              echo "Importing $2 ..."
              curl -sS -f -X POST "$DEFECTDOJO_URL/api/v2/reimport-scan/" \
                -H "Authorization: Token $DEFECTDOJO_TOKEN" \
                -F "scan_type=$1" \
                -F "product_name=$DD_PRODUCT" \
                -F "engagement_name=$DD_ENGAGEMENT" \
                -F "test_title=$2" \
                -F "auto_create_context=true" \
                -F "close_old_findings=true" \
                -F "minimum_severity=Info" \
                -F "file=@$3"
            else
              echo "::warning::$3 absent — $2 import skipped."
            fi
          }
          reimport "Semgrep JSON Report" "Semgrep SAST"    reports/semgrep-reports/semgrep.json
          reimport "SARIF"              "Trivy Image"      reports/trivy-image-sarif/trivy-image.sarif
          reimport "SARIF"              "Trivy Filesystem" reports/trivy-fs-sarif/trivy-fs.sarif
          reimport "SARIF"              "Trivy Config"     reports/trivy-config-sarif/trivy-config.sarif
